# dsh-api3d —— 把 API3D（api3d.cn）接成一个 pi-ai provider 路由
#
# 本文件是「组合包补丁层」，由 package.json 的 dsh.bundle.patch 指向，叠在
# dsh-base / dsh-web-app 之上应用。
#
#   dsh plugin --profile <profile> add dsh-api3d
#
# ── 这里为什么**没有** llm-pi-ai 路由声明 ───────────────────────────────────
# 路由骨架（displayName / 凭据引用 / 协议 / compat）与模型能力模板在
# lib/route.js；模型目录来自设置里导入的那份，由宿主半在运行时装进 llm-pi-ai。
# 不在这里声明，有两个都绕不过的理由：
#
# 1. pi-ai 把「零模型的自定义路由」判为配置错误：
#        resolves no models; the installed catalog does not describe this route,
#        so its models must be listed in configuration
#    而本插件的目录只可能来自向导里的站点查询，安装那一刻必然是空的。声明一条带
#    模型的路由 = 还没导入就显示模型；声明一条不带模型的路由 = 启动即报配置错误。
# 2. profile 自己的补丁层在所有 bundle 层之后应用，且 loader 是把补丁的 `config`
#    赋值在组合结果之上（只有一层深）—— 任何自带 provider 的 profile 都会把整个
#    `providers` 字典替换掉。所以路由必须在**每一次解析**时被装回去，而不是在这里
#    声明一次。
#
# 效果：装完插件、还没走向导导入模型时，模型选择器里没有任何 api3d 模型；导入后路由
# 立刻出现，不用重启。
#
# ── 哨兵地址 ────────────────────────────────────────────────────────────
# 路由的 baseURL 是 `https://upstream.api3d.invalid/v1`（RFC 2606 保留域）：适配器
# 逐请求解析 baseURL，但读不到本插件的设置命名空间，所以围栏在出站时把它改写为设置
# 里的真实地址。围栏没装上时请求会以 DNS 失败大声报错，而不是静默打到别的服务器。
#
# 这么绕是为了让「换地址」变成设置页里的一次写入：常量写死的话，换机房就得改文件、
# 重装、重启。
#
# ── 凭据 ────────────────────────────────────────────────────────────────
# apiKeyEnv 是**凭据引用**，逐请求解析；密钥存在 $DSH_HOME/.credentials.yaml 或
# 环境变量里，永远不进本文件（本文件会进版本库）。向导的「API Key」输入框写的就是
# 这条引用。
#
# ⚠️ 不要把密钥挪进 headers：那个 dict 会被适配器的 describe() 原样返回，并被
#    Models 设置页渲染出来。
#
# ── 模型能力 ────────────────────────────────────────────────────────────
# 站点几乎不报能力字段（api3d.cn 的 /v1/models 只有 id 与 display_name），所以
# lib/route.js 的 MODEL_TEMPLATE 只是**兜底**：上下文窗口、最大输出、输入模态、
# 思考档位都能在向导第 2 步逐条改。核实站点到底在售什么：
#
#     npm run probe-models            # 用 API3D_API_KEY 打 GET {baseURL}/models
#
# 2026-10-20 实测：站点只返回 `deepseek-v4.1-flash`；`deepseek-v4.1-flash-1017`
# 属于**另一个分组**（福利组），用主 key 请求会得到 404 model_not_found。分组不同
# = 凭据不同 = 应当是另一条 provider 路由，不能塞进同一条路由的模型列表里。

# 插件行本身：一个按包名引用的裸插件条目。
# id 同时是 loader entry id 与设置命名空间，客户端半按同一个字面量注册设置卡。
- insert:
    - id: api3d
      name: 'dsh-api3d'
